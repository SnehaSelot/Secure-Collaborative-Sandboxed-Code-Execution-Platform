version: "29.7.2"

services:
  api:
    build: ./backend                       # builds from the Dockerfile in this folder
    ports:
      - "8000:8000"                 # host:container — hit localhost:8000
    environment:
      DATABASE_URL: postgresql://sandbox_user:sandbox_pass@postgres:5432/sandbox_db
    depends_on:
      - postgres
    volumes:
      - ./backend:/app                    # live-reloads code into the container while you dev

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sandbox_user
      POSTGRES_PASSWORD: sandbox_pass
      POSTGRES_DB: sandbox_db
    ports:
      - "5432:5432"                 # lets you connect a DB client from your host too
    volumes:
      - pgdata:/var/lib/postgresql/data   # persists data across container restarts

volumes:
  pgdata: