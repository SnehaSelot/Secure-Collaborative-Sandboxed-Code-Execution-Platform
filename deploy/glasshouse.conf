# GlassHouse — Nginx Configuration (Frontend SPA)
# Install to: /etc/nginx/sites-available/glasshouse
# Symlink to: /etc/nginx/sites-enabled/glasshouse

server {
    listen 80 default_server;
    server_name _;

    # -----------------------------------------------------------------------
    # Frontend — serve the Vite-built React SPA
    # -----------------------------------------------------------------------
    root /var/www/glasshouse;
    index index.html;

    # SPA fallback: serve index.html for any path that isn't a real file.
    # This lets react-router handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (hashed filenames from Vite)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
    }
}

